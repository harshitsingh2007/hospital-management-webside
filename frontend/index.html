<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link id="app-dynamic-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230284C7'%3E%3Cpath d='M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
        margin: 0;
        padding: 0;
      }
      .hide-modal-scrollbar::-webkit-scrollbar,
      .no-scrollbar::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
      .hide-modal-scrollbar,
      .no-scrollbar {
        -ms-overflow-style: none !important;
        scrollbar-width: none !important;
      }
      :root {
        --patient-card-bg: #FFFFFF;
        --patient-card-border: #E2E8F0;
        --patient-text-main: #0F172A;
        --patient-text-sub: #64748B;
        --patient-sub-card: #F8FAFC;
        --patient-tag-bg: #F0F9FF;
        --patient-tag-color: #0369A1;
        --patient-tag-border: #BAE6FD;
        --apt-active-bg: #F0F9FF;
        --apt-active-border: #BAE6FD;
        --emergency-card-bg: #FEF2F2;
        --emergency-card-border: #FECACA;
        --emergency-card-text: #DC2626;

        --staff-card-bg: #FFFFFF;
        --staff-card-border: #E2E8F0;
        --staff-card-text: #0F172A;
        --staff-sub-bg: #F8FAFC;
        --staff-sub-border: #E2E8F0;
        --staff-btn-bg: #FFFFFF;
        --staff-btn-text: #334155;
        --staff-th-bg: #F8FAFC;
        --staff-td-border: #F1F5F9;
        --staff-muted-text: #64748B;
        --staff-dropzone-bg: #F0F9FF;
        --staff-dropzone-border: #BAE6FD;
      }
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #F8FAFC;
        color: #0F172A;
        min-height: 100vh;
        transition: background-color 0.25s ease, color 0.25s ease;
      }
      body.theme-dark {
        background-color: #090D16;
        color: #F1F5F9;
        --patient-card-bg: #0F172A;
        --patient-card-border: #1E293B;
        --patient-text-main: #F8FAFC;
        --patient-text-sub: #94A3B8;
        --patient-sub-card: #1E293B;
        --patient-tag-bg: rgba(2, 132, 199, 0.18);
        --patient-tag-color: #38BDF8;
        --patient-tag-border: rgba(56, 189, 248, 0.3);
        --apt-active-bg: rgba(2, 132, 199, 0.16);
        --apt-active-border: #0284C7;
        --emergency-card-bg: rgba(220, 38, 38, 0.14);
        --emergency-card-border: rgba(220, 38, 38, 0.35);
        --emergency-card-text: #F87171;

        --staff-card-bg: #0F172A;
        --staff-card-border: #334155;
        --staff-card-text: #F1F5F9;
        --staff-sub-bg: #1E293B;
        --staff-sub-border: #334155;
        --staff-btn-bg: #1E293B;
        --staff-btn-text: #E2E8F0;
        --staff-th-bg: #1E293B;
        --staff-td-border: #1E293B;
        --staff-muted-text: #94A3B8;
        --staff-dropzone-bg: #0B1120;
        --staff-dropzone-border: #0284C7;
        color-scheme: dark;
      }
      body.theme-dark select option {
        background-color: #0F172A;
        color: #F8FAFC;
      }
      #root {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
      }
      @media print {
        body * {
          visibility: hidden;
        }
        #printable-rx-slip, #printable-rx-slip * {
          visibility: visible;
        }
        #printable-rx-slip {
          position: absolute;
          left: 0;
          top: 0;
          width: 100% !important;
          max-width: 100% !important;
          box-shadow: none !important;
          border: none !important;
          padding: 15px !important;
          margin: 0 !important;
        }
        #printable-rx-slip button {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
